name: Release

# Build the Windows tray app (as a zip and as a standalone portable .exe) and
# the macOS menu-bar app (as a zip), together with the CLI they drive, and
# publish all three as assets on a GitHub Release. Trigger by pushing a
# version tag:
#
#   git tag v1.2.0
#   git push origin v1.2.0
#
# `workflow_dispatch` is there so a build can be re-run manually without
# cutting a new tag (e.g. to fix a packaging issue); it does not publish a
# release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build CLI
        run: |
          npm ci
          npm run build
      - name: Install tray app
        run: npm ci
        working-directory: windows
      # Ships with node_modules and dist/ already built so a user only needs
      # Node.js installed, not this repo's toolchain.
      - name: Package zip (checkout-style, includes the CLI)
        shell: pwsh
        run: |
          Compress-Archive -Path dist, node_modules, package.json, windows `
            -DestinationPath ilias-sync-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ilias-sync-windows
          path: ilias-sync-windows.zip
      # A standalone, double-clickable exe for people who don't want the zip.
      # The CLI (dist/ + node_modules) is bundled into it as a resource.
      - name: Package portable exe (tray app)
        working-directory: windows
        run: npm run package
      - name: Rename exe
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path windows/release-build -Filter *.exe -Recurse | Select-Object -First 1
          Copy-Item $exe.FullName "ILIAS Sync.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: ilias-sync-windows-exe
          path: "ILIAS Sync.exe"

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build CLI
        run: |
          npm ci
          npm run build
      - name: Build menu-bar app
        run: npm run build:mac-app
      - name: Package
        run: |
          mkdir -p package
          cp -R dist node_modules package.json package/
          cp -R "macos/build/ILIAS Sync.app" "package/ILIAS Sync.app"
          cd package && zip -r -y -q ../ilias-sync-macos.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: ilias-sync-macos
          path: ilias-sync-macos.zip

  release:
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/ilias-sync-windows.zip
            artifacts/ILIAS Sync.exe
            artifacts/ilias-sync-macos.zip
          generate_release_notes: true
